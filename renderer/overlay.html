<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>Select area</title>
  <style>
    :root { --brand: #00B1FF; --ink: #003380; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; pointer-events: auto;
      overflow: hidden; cursor: crosshair; user-select: none;
      background: rgba(0, 20, 45, 0.30);
      font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    }
    .shade { position: fixed; background: rgba(0, 20, 45, 0.52); pointer-events: none; }
    #box {
      position: fixed; display: none; pointer-events: none;
      border: 2px solid var(--brand);
      box-shadow: 0 0 0 1px rgba(0,51,128,.45), 0 0 24px rgba(0,177,255,.45);
    }
    #dims {
      position: fixed; display: none; pointer-events: none;
      padding: 5px 9px; border-radius: 5px;
      background: var(--ink); color: #fff;
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    #prompt {
      position: fixed; top: 32px; left: 50%; transform: translateX(-50%);
      padding: 11px 20px; border-radius: 8px; pointer-events: none;
      background: #fff; color: var(--ink);
      font-size: 13px; font-weight: 600;
      box-shadow: 0 6px 24px rgba(0, 20, 45, .28);
    }
    #cancel {
      position: fixed; top: 32px; right: 32px;
      padding: 10px 20px; border: 0; border-radius: 8px;
      background: #fff; color: #003380;
      font-family: inherit; font-size: 13px; font-weight: 600;
      cursor: pointer; box-shadow: 0 6px 24px rgba(0, 20, 45, .28);
    }
    #cancel:hover { background: #DC2626; color: #fff; }
  </style>
</head>
<body>
  <div class="shade" id="sh-top"></div>
  <div class="shade" id="sh-bottom"></div>
  <div class="shade" id="sh-left"></div>
  <div class="shade" id="sh-right"></div>
  <div id="box"></div>
  <div id="dims"></div>
  <div id="prompt">Drag to choose the area</div>
  <button id="cancel" type="button">Cancel</button>

  <script>
    const box = document.getElementById('box');
    const dims = document.getElementById('dims');
    const prompt = document.getElementById('prompt');
    const shades = {
      top: document.getElementById('sh-top'), bottom: document.getElementById('sh-bottom'),
      left: document.getElementById('sh-left'), right: document.getElementById('sh-right')
    };

    const W = window.innerWidth, H = window.innerHeight;
    let startX = 0, startY = 0, dragging = false;

    function layout(x, y, w, h) {
      box.style.left = x + 'px'; box.style.top = y + 'px';
      box.style.width = w + 'px'; box.style.height = h + 'px';

      Object.assign(shades.top.style, { left: 0, top: 0, width: W + 'px', height: y + 'px' });
      Object.assign(shades.bottom.style, { left: 0, top: (y + h) + 'px', width: W + 'px', height: (H - y - h) + 'px' });
      Object.assign(shades.left.style, { left: 0, top: y + 'px', width: x + 'px', height: h + 'px' });
      Object.assign(shades.right.style, { left: (x + w) + 'px', top: y + 'px', width: (W - x - w) + 'px', height: h + 'px' });

      dims.textContent = Math.round(w) + ' × ' + Math.round(h);
      const below = y + h + 10;
      dims.style.left = Math.min(x, W - 100) + 'px';
      dims.style.top = (below + 26 < H ? below : Math.max(0, y - 30)) + 'px';
    }

    document.getElementById('cancel').addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      window.api.cancelRegion();
    });

    // Right click cancels too, which is what most capture tools do.
    window.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      window.api.cancelRegion();
    });

    window.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      try { e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId); } catch {}
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      box.style.display = 'block'; dims.style.display = 'block';
      prompt.style.display = 'none';
      document.getElementById('cancel').style.display = 'none';
      document.body.style.background = 'rgba(0,0,0,0.01)';
      layout(startX, startY, 0, 0);
    });

    window.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      layout(Math.min(startX, e.clientX), Math.min(startY, e.clientY),
             Math.abs(e.clientX - startX), Math.abs(e.clientY - startY));
    });

    window.addEventListener('pointerup', (e) => {
      if (!dragging) return;
      dragging = false;
      const x = Math.min(startX, e.clientX), y = Math.min(startY, e.clientY);
      const w = Math.abs(e.clientX - startX), h = Math.abs(e.clientY - startY);
      if (w < 12 || h < 12) return window.api.cancelRegion();
      // Fractions, not pixels: display scaling never enters the arithmetic.
      window.api.sendRegion({ x: x / W, y: y / H, w: w / W, h: h / H });
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') window.api.cancelRegion();
    });
  </script>
</body>
</html>
