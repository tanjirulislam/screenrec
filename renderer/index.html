<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; img-src 'self' data: blob:" />
  <title>Screen Recorder</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="titlebar">
    <span class="title">
      <svg class="title-icon" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1" y="3" width="10" height="10" rx="2" />
        <path d="M12 7l3-2v6l-3-2z" />
      </svg>
      Screen Recorder
    </span>
    <div class="titlebar-actions">
      <button id="btn-min" class="chrome-btn" aria-label="Minimize">
        <svg viewBox="0 0 10 10"><path d="M0 5h10" /></svg>
      </button>
      <button id="btn-hide" class="chrome-btn danger" aria-label="Close">
        <svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" /></svg>
      </button>
    </div>
  </header>

  <!-- ============ SETUP VIEW ============ -->
  <div id="view-setup">
    <main>

      <fieldset class="group">
        <legend>Record Screen</legend>

        <label class="mode">
          <input type="radio" name="mode" value="window" />
          <svg class="mode-icon" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" rx="1"/><path d="M1 5h18"/></svg>
          <span class="mode-name">Window / Object</span>
        </label>
        <select id="window-source" class="control indented" disabled></select>

        <label class="mode">
          <input type="radio" name="mode" value="region" />
          <svg class="mode-icon dashed" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" rx="1"/></svg>
          <span class="mode-name">Rectangular Region</span>
        </label>

        <label class="mode">
          <input type="radio" name="mode" value="fixed" />
          <svg class="mode-icon" viewBox="0 0 20 16"><path d="M2 1v14M18 1v14"/><rect x="5" y="3" width="10" height="10"/></svg>
          <span class="mode-name">Fixed-Size Region</span>
        </label>
        <select id="fixed-size" class="control indented" disabled>
          <option value="1920x1080">1920 × 1080 — Full HD</option>
          <option value="1280x720" selected>1280 × 720 — HD</option>
          <option value="1080x1080">1080 × 1080 — Square</option>
          <option value="1080x1920">1080 × 1920 — Vertical</option>
          <option value="854x480">854 × 480 — Small</option>
        </select>

        <label class="mode">
          <input type="radio" name="mode" value="notaskbar" />
          <svg class="mode-icon" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" rx="1"/><path d="M1 12h18" class="faint"/></svg>
          <span class="mode-name">Full Screen Without Taskbar</span>
        </label>

        <label class="mode">
          <input type="radio" name="mode" value="full" checked />
          <svg class="mode-icon" viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" rx="1"/><path d="M1 1l18 14M19 1L1 15"/></svg>
          <span class="mode-name">Full Screen</span>
        </label>

        <label class="mode" id="mode-repeat-wrap">
          <input type="radio" name="mode" value="repeat" />
          <svg class="mode-icon" viewBox="0 0 20 16"><path d="M4 6a6 6 0 1 1 0 4"/><path d="M4 3v4h4"/></svg>
          <span class="mode-name">Repeat Last Region</span>
          <span class="mode-detail" id="repeat-detail"></span>
        </label>

        <div class="screen-picker">
          <label for="screen-source">Screen</label>
          <select id="screen-source" class="control"></select>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Record Audio</legend>
        <label class="check">
          <input type="checkbox" id="sys-audio" checked />
          <span>Computer sound</span>
        </label>
        <label class="check">
          <input type="checkbox" id="mic-audio" />
          <span>Microphone</span>
        </label>
        <select id="mic-device" class="control indented" disabled></select>
        <div class="meter" id="meter" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Webcam</legend>
        <label class="check">
          <input type="checkbox" id="cam-on" />
          <span>Show webcam in corner</span>
        </label>
        <div class="row indented">
          <select id="cam-device" class="control" disabled></select>
          <select id="cam-corner" class="control narrow" disabled>
            <option value="br">Bottom right</option>
            <option value="bl">Bottom left</option>
            <option value="tr">Top right</option>
            <option value="tl">Top left</option>
          </select>
        </div>
      </fieldset>

      <fieldset class="group collapsed" id="options-group">
        <legend>
          <button type="button" id="options-toggle" class="legend-toggle" aria-expanded="false">
            <svg class="caret" viewBox="0 0 8 8"><path d="M2 1l3 3-3 3"/></svg>
            Options
          </button>
        </legend>
        <div class="group-body">
          <div class="row">
            <label class="field">
              <span>Frame rate</span>
              <select id="fps" class="control">
                <option value="24">24 fps</option>
                <option value="30" selected>30 fps</option>
                <option value="60">60 fps</option>
              </select>
            </label>
            <label class="field">
              <span>Quality</span>
              <select id="quality" class="control">
                <option value="4000000">Standard</option>
                <option value="8000000" selected>High</option>
                <option value="16000000">Best</option>
              </select>
            </label>
          </div>
          <label class="check">
            <input type="checkbox" id="to-mp4" checked />
            <span>Save as MP4 (uncheck for faster WebM)</span>
          </label>
          <p class="path-note" id="path-note"></p>
        </div>
      </fieldset>
    </main>

    <footer>
      <button id="btn-record" class="btn primary">
        <span class="dot"></span> Record
      </button>
      <button id="btn-folder" class="btn">Recordings</button>
      <p class="hint" id="hint">Press Ctrl+Shift+R anywhere to start or stop</p>
    </footer>
  </div>

  <!-- ============ RECORDING VIEW ============ -->
  <div id="view-recording" hidden>
    <div class="live">
      <span class="tally" id="tally"></span>
      <span class="timecode" id="timecode">00:00:00</span>
      <span class="filesize" id="filesize"></span>
    </div>
    <div class="live-actions">
      <button id="btn-pause" class="btn">Pause</button>
      <button id="btn-stop" class="btn primary">Stop</button>
    </div>
  </div>

  <!-- ============ BUSY VIEW ============ -->
  <div id="view-busy" hidden>
    <div class="busy">
      <div class="spinner"></div>
      <p id="busy-text">Saving…</p>
    </div>
  </div>

  <canvas id="stage" hidden></canvas>
  <video id="screen-video" hidden muted playsinline></video>
  <video id="cam-video" hidden muted playsinline></video>

  <script src="app.js"></script>
</body>
</html>
