name: Build Windows App

# Runs on every push to main (produces a downloadable artifact), and on
# every version tag (also publishes a public Release page).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write     # needed to create the Release

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      # Node 20 ships npm 10, which runs package install scripts without
      # prompting. Newer npm blocks them, and Electron's postinstall is what
      # downloads electron.exe — without it the build fails.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the installer
        run: npm run build

      # Downloadable from the Actions run page. Kept for 30 days.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: ScreenRec-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
          retention-days: 30
          if-no-files-found: error

      # Only for tagged versions: a permanent public download page.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
          body: |
            ## Download

            - **ScreenRec-Setup.exe** — normal installer, adds a Start Menu shortcut
            - **ScreenRec-portable.exe** — runs directly, installs nothing

            Windows will show a SmartScreen warning because this build is not
            code-signed. Choose **More info → Run anyway** to continue.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
