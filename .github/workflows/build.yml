name: Build Windows App

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      # Node 22 ships an npm that runs package install scripts without
      # prompting. Electron's postinstall is what downloads electron.exe,
      # so blocking it fails the build.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build the installer
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v5
        with:
          name: ScreenRec-Windows
          path: dist/*.exe
          retention-days: 30
          if-no-files-found: error

      # The GitHub CLI is preinstalled on the runner. Using it avoids
      # downloading a third-party action, which was hitting rate limits.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.exe \
            --title "ScreenRec ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Windows shows a SmartScreen warning because this build is not code signed. Choose More info then Run anyway."
